[bootstrap.packages]
# System libraries, build tools, and system CLI tools
"brew:autoconf" = "latest"
"brew:automake" = "latest"
"brew:bat" = "latest"
"brew:bitwarden-cli" = "latest"
"brew:curl" = "latest"
"brew:direnv" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:jq" = "latest"
"brew:pkgconf" = "latest"
"brew:rsync" = "latest"
"brew:unzip" = "latest"
"brew:wget" = "latest"
"brew:xz" = "latest"
"brew:zoxide" = "latest"
"brew:git" = { os = "macos", version = "latest" }
"brew:zsh" = { os = "macos", version = "latest" }
"brew:coreutils" = { os = "macos", version = "latest" }
"brew:libyaml" = { os = "macos", version = "latest" }
"brew:openssl@3" = { os = "macos", version = "latest" }
"brew:readline" = { os = "macos", version = "latest" }
"brew:zlib" = { os = "macos", version = "latest" }
"apt:git" = { os = "linux", version = "latest" }
"apt:zsh" = { os = "linux", version = "latest" }
"apt:build-essential" = { os = "linux", version = "latest" }
"apt:ca-certificates" = { os = "linux", version = "latest" }
"apt:iproute2" = { os = "linux", version = "latest" }
"apt:libffi-dev" = { os = "linux", version = "latest" }
"apt:libncurses-dev" = { os = "linux", version = "latest" }
"apt:libreadline-dev" = { os = "linux", version = "latest" }
"apt:libssl-dev" = { os = "linux", version = "latest" }
"apt:libyaml-dev" = { os = "linux", version = "latest" }
"apt:openssh-client" = { os = "linux", version = "latest" }
"apt:python3" = { os = "linux", version = "latest" }
"apt:tar" = { os = "linux", version = "latest" }
"apt:wl-clipboard" = { os = "linux", version = "latest" }
"apt:xclip" = { os = "linux", version = "latest" }
"apt:zlib1g-dev" = { os = "linux", version = "latest" }

# Desktop apps
"brew-cask:1password" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:raycast" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }

[tools]
# Runtimes
go = "latest"
node = "26.1.0"
python = "3.13.13"
ruby = "3.4.5"
rust = { version = "latest", mr_boxington = true }
erlang = "28.5"
elixir = "1.19.5"
java = "latest"

# Development tools
uv = "latest"
ast-grep = "latest"
ruff = "latest"
golangci-lint = "latest"
hurl = "8.0.1"

# Media tools
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
mpv = "latest"
ffmpeg = "latest"

# Other CLI tools
dust = "1.2.6"
eza = "latest"
"github:Ataraxy-Labs/lazydiff" = "0.1.0-alpha.7"
"github:agavra/tuicr" = "latest"
gh = "latest"
helm = "latest"
lazygit = "latest"
neovim = "latest"
rclone = "latest"
ripgrep = "latest"
mr-boxington = { version = "latest", postinstall = "mbx setup --yes" }
btop = "1.2.13"

[settings]

[settings.ruby]
compile = false

[tasks.install-runtimes]
description = "Install runtimes with mise"
run = "mise install go node python ruby rust erlang elixir java"

[tasks.install-dev-tools]
description = "Install dev tools with mise"
run = "mise install uv ast-grep ruff golangci-lint hurl go"

[tasks.install-media-tools]
description = "Install media tools with mise"
run = "mise install yt-dlp mpv ffmpeg"

[tasks.install-cli-tools]
description = "Install development and media tools"
depends = ["install-dev-tools", "install-media-tools"]

[tasks.install-system]
description = "Install native system libraries and build tools"
run = """
case "$(uname -s)" in
  Darwin) mise bootstrap packages apply --manager brew ;;
  Linux)
    mise bootstrap packages apply --manager apt
    if command -v brew >/dev/null 2>&1; then
      mise bootstrap packages apply --manager brew
    fi
    ;;
  *) echo "System packages support macOS and Debian/Ubuntu Linux" >&2; exit 1 ;;
esac
"""

[tasks.install-apps]
description = "Install desktop apps on macOS"
run = """
case "$(uname -s)" in
  Darwin) mise bootstrap packages apply --manager brew-cask ;;
  *) echo "No desktop apps configured for this OS" ;;
esac
"""
