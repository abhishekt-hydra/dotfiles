# tmux config managed by dotfiles.

# Plugins (TPM bootstraps itself near the end of this file).
#
# Order matters: TPM loads these in declaration order, and continuum installs
# its periodic save by prepending an interpolation to status-right. Dracula
# *replaces* status-right wholesale, so continuum must load after it or the
# save hook is silently wiped and nothing is ever saved.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'

# Dracula/window colors.
set -g @dracula-window-status-fg '#959591'
set -g @dracula-window-status-bg '#292b36'
set -g @dracula-window-status-current-fg '#f8f8f2'
set -g @dracula-window-status-current-bg '#44475a'
set -g @dracula-show-powerline false
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cpu-usage ram-usage custom:network_speed.sh custom:disk_space.sh time battery"
set -g @dracula-custom-plugin-colors "light_purple dark_gray"
set -g @dracula-show-location false
set -g @dracula-border-contrast true
set -g @dracula-synchronize-panes-label "Sync"
set -g @dracula-network-bandwidth-show-interface true
set -g @dracula-battery-label ""
set -g @dracula-battery-colors "gray orange"
set -g @dracula-cpu-usage-colors "dark_gray orange"
set -g @dracula-ram-usage-colors "dark_gray orange"
set -g @dracula-time-colors "dark_gray orange"
set -g @dracula-git-colors "dark_gray green"
set -g @dracula-military-time true
set -g @dracula-time-format "%H:%M:%S"

# Continuum settings.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '2'

# Basics.
set -g mouse on
set -g status on
set -g history-limit 50000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g repeat-time 500
set -s escape-time 0
set -g default-terminal "tmux-256color"
set-option -g xterm-keys on
set-window-option -g xterm-keys on
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# Amp/modern terminal compatibility.
set -g allow-passthrough all
set -ga terminal-features ",*:hyperlinks"
# Clipboard writers must be exactly ONE (pbcopy). Measured on tmux next-3.8:
#   off      - app OSC 52 dropped, no tmux buffer created
#   external - app OSC 52 dropped too (it does NOT "accept and forward" it)
#   on       - app OSC 52 creates a buffer AND is forwarded to every client
# In all three modes `tmux load-buffer -w` still emits OSC 52 outward, and a
# tmux-passthrough-wrapped OSC 52 is forwarded to EVERY attached client of the
# session no matter what this is set to. That is why 'external' never fixed the
# "NSPasteboard#writeObjects: returned false" warnings: Claude Code fires
# pbcopy + load-buffer -w + passthrough OSC 52 on a single copy, and pbcopy
# raced Alacritty on the macOS pasteboard. The passthrough path is closed on
# the terminal side (terminal.osc52 = "Disabled" in alacritty.toml); this
# closes tmux's own outward path.
set -s set-clipboard off
set -s extended-keys on
# tmux 3.4 supports extended keys but predates extended-keys-format. Gate it
# on a quiet version check, so this config loads on Ubuntu 24.04 while
# retaining CSI-u on newer tmux releases (including `next-3.x`).
if-shell 'tmux -V | grep -Eq "3\\.([5-9]|[1-9][0-9])|[4-9][0-9]*\\."' \
  'set -s extended-keys-format csi-u'
bind -n S-Enter send-keys -l "\x1b[13;2u"

# Pane borders.
set -g pane-border-style 'fg=#44475a,bg=default'
set -g pane-active-border-style 'fg=#50fa7b,bg=default,bold'
set -g pane-border-lines heavy

# Pane/window bindings.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r command-prompt "rename-session %%"
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Alt-arrow pane navigation.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane synchronization.
# Extended-keys terminals (Ghostty, kitty) report plain Ctrl+y as C-y; raw
# terminals map the same chord to C-Y. Bind both so either way works.
bind C-y setw synchronize-panes
bind C-Y setw synchronize-panes
setw -g window-status-current-format '#{?pane_synchronized,#[bg=red],}#I:#W'
setw -g window-status-format         '#{?pane_synchronized,#[bg=red],}#I:#W'

# Clipboard integration: macOS first, then Wayland, then X11.
# copy-command backs every *bare* copy-pipe binding, which is what tmux's own
# mouse defaults (MouseDragEnd1Pane, Double/TripleClick1Pane) use - without it
# a mouse selection only ever reached the tmux buffer, never the system
# clipboard. y/Enter below stay bare so keyboard and mouse take one path.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set -s copy-command "pbcopy"; bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel; bind-key p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"' \
  'if-shell "command -v wl-copy >/dev/null 2>&1" "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"wl-copy\"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \"wl-copy\"; bind-key p run \"wl-paste | tmux load-buffer - ; tmux paste-buffer\"" "if-shell \"command -v xclip >/dev/null 2>&1\" \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard -i\\\"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard -i\\\"; bind-key p run \\\"xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer\\\"\""'

# Status bar.
set -g status-style bg=default,fg=white
set -g status-left ""
set -g status-right "#[fg=blue]%H:%M #[fg=white]%d-%b"
set -g status-interval 2
set -g @scroll-speed-num-lines-per-scroll 3

# Auto-detect primary Linux network interface for Dracula when `ip` exists.
if-shell 'command -v ip >/dev/null 2>&1' \
  'run-shell "tmux set-option -g @dracula-network-bandwidth \"$(ip -4 route ls | grep default | awk '\''{print $5}'\'')\""'

# Install TPM if missing, then load it. Must remain last.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# Dracula custom widgets must reside in the plugin's scripts directory. Keep
# the implementation mise-tracked while linking it into that directory after
# TPM has installed the plugin.
run-shell 'ln -sfn "$HOME/.tmux/network_speed.sh" "$HOME/.tmux/plugins/tmux/scripts/network_speed.sh"'
run-shell 'ln -sfn "$HOME/.tmux/disk_space.sh" "$HOME/.tmux/plugins/tmux/scripts/disk_space.sh"'
run '~/.tmux/plugins/tmux/dracula.tmux'

# Dracula rewrites status-right wholesale above, which drops continuum's
# "#(continuum_save.sh)" interpolation - the only thing that drives periodic
# saving. Re-run continuum last to reinstall it. The plugin is idempotent: it
# skips the interpolation if already present, and only auto-restores when the
# server genuinely just started, so a `source-file` reload won't clobber the
# live session.
run '~/.tmux/plugins/tmux-continuum/continuum.tmux'
